# The stages run in this order. A stage only starts if every job of the previous stage passed.
stages:
  - test
  - deploy

# ---------- CI: run the Selenium tests ----------
selenium-tests:
  stage: test
  image: markhobson/maven-chrome:jdk-21   # a Linux machine with Java and Chrome already installed
  timeout: 15 minutes                     # stop the job if something hangs
  script:
    # Download Selenium and JUnit 4 (like you did in Part 1)
    - curl -sL -o selenium.zip https://github.com/SeleniumHQ/selenium/releases/download/selenium-4.52.0/selenium-java-4.52.0.zip
    - mkdir selenium && cd selenium && jar xf ../selenium.zip && cd ..
    - curl -sL -o selenium/junit.jar https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
    - curl -sL -o selenium/hamcrest.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar
    # Start the website (does the same job as Live Server)
    - jwebserver -p 5500 -d "$CI_PROJECT_DIR/website" > server.log 2>&1 &
    # Compile the tests
    - javac -cp "selenium/*:selenium/lib/*" -d out src/seleniumScripts/*.java
    # Run the tests
    - java -cp "out:selenium/*:selenium/lib/*" org.junit.runner.JUnitCore seleniumScripts.TestGenerator

# ---------- CD: publish the website on GitLab Pages ----------
pages:
  stage: deploy                           # runs only after the test stage passed
  image: alpine:latest
  timeout: 15 minutes
  script:
    - cp -r website public                # GitLab Pages publishes the folder called public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH   # publish from main only, not from other branches
