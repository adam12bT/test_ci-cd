name: Test and deploy TestMart

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Download Selenium and JUnit
        run: |
          curl -fLsS --retry 3 -o selenium.zip https://github.com/SeleniumHQ/selenium/releases/download/selenium-4.52.0/selenium-java-4.52.0.zip
          mkdir -p selenium
          (cd selenium && jar xf ../selenium.zip)
          curl -fLsS --retry 3 -o selenium/junit.jar https://repo.maven.apache.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -fLsS --retry 3 -o selenium/hamcrest.jar https://repo.maven.apache.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar
      - name: Start website
        run: |
          python3 -m http.server 5500 --bind 127.0.0.1 --directory website > server.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:5500/index.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat server.log
          exit 1
      - name: Compile and run Selenium tests
        shell: bash
        run: |
          set -o pipefail
          javac -cp "selenium/*:selenium/lib/*" -d out src/seleniumScripts/*.java
          java -cp "out:selenium/*:selenium/lib/*" org.junit.runner.JUnitCore seleniumScripts.TestGenerator 2>&1 | tee test-results.log
      - name: Preserve test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: |
            test-results.log
            server.log

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
