<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product - TestMart</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="product">
  <header>
    <a id="logo" href="index.html">TestMart</a>
    <form id="search-form" action="index.html" method="get">
      <input id="search-input" name="q" type="text" placeholder="Search for a product">
      <button id="search-button" type="submit">Search</button>
    </form>
    <nav id="nav"></nav>
  </header>
  <main>
    <section id="product-details">
      <div id="product-icon"></div>
      <div class="product-info">
        <h1 id="product-name"></h1>
        <p id="product-price"></p>
        <p id="product-stock"></p>
        <p id="product-description"></p>
        <button id="add-to-cart" type="button">Add to cart</button>
      </div>
    </section>
  </main>
  <script src="js/shop.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
