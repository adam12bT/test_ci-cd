<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In - TestMart</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
  <header>
    <a id="logo" href="index.html">TestMart</a>
    <form id="search-form" action="index.html" method="get">
      <input id="search-input" name="q" type="text" placeholder="Search for a product">
      <button id="search-button" type="submit">Search</button>
    </form>
    <nav id="nav"></nav>
  </header>
  <main>
    <section class="panel">
      <h1>Sign in</h1>
      <form id="login-form" class="stacked" novalidate>
        <label>Email <input id="login-email" type="email"></label>
        <label>Password <input id="login-password" type="password"></label>
        <button id="login-button" type="submit">Sign in</button>
      </form>
      <p class="switch">No account yet? <a href="signup.html">Sign up</a></p>
    </section>
  </main>
  <script src="js/shop.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
