<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up - TestMart</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="signup">
  <header>
    <a id="logo" href="index.html">TestMart</a>
    <form id="search-form" action="index.html" method="get">
      <input id="search-input" name="q" type="text" placeholder="Search for a product">
      <button id="search-button" type="submit">Search</button>
    </form>
    <nav id="nav"></nav>
  </header>
  <main>
    <section class="panel">
      <h1>Create an account</h1>
      <form id="signup-form" class="stacked" novalidate>
        <label>Full name <input id="signup-name" type="text"></label>
        <label>Email <input id="signup-email" type="email"></label>
        <label>Password <input id="signup-password" type="password"></label>
        <button id="signup-button" type="submit">Sign up</button>
      </form>
      <p class="switch">Already have an account? <a href="login.html">Sign in</a></p>
    </section>
  </main>
  <script src="js/shop.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
