<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Account - TestMart</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="account">
  <header>
    <a id="logo" href="index.html">TestMart</a>
    <form id="search-form" action="index.html" method="get">
      <input id="search-input" name="q" type="text" placeholder="Search for a product">
      <button id="search-button" type="submit">Search</button>
    </form>
    <nav id="nav"></nav>
  </header>
  <main>
    <section class="panel">
      <h1>My account</h1>
      <form id="account-form" class="stacked" novalidate>
        <label>Full name <input id="account-name" type="text"></label>
        <label>Email <input id="account-email" type="email" readonly></label>
        <label>Phone <input id="account-phone" type="text"></label>
        <label>Address <input id="account-address" type="text"></label>
        <button id="account-save" type="submit">Save changes</button>
      </form>
    </section>
  </main>
  <script src="js/shop.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
