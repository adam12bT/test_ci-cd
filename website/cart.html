<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Cart - TestMart</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="cart">
  <header>
    <a id="logo" href="index.html">TestMart</a>
    <form id="search-form" action="index.html" method="get">
      <input id="search-input" name="q" type="text" placeholder="Search for a product">
      <button id="search-button" type="submit">Search</button>
    </form>
    <nav id="nav"></nav>
  </header>
  <main>
    <section class="panel wide">
      <h1>Your cart</h1>
      <ul id="cart-items"></ul>
      <p id="cart-summary">Total: <span id="cart-total"></span></p>
    </section>
  </main>
  <script src="js/shop.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
